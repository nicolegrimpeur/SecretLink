# ─────────────────────────────────────────────────────────────────────────────
#  Base éphémère pour les tests d'intégration du serveur.
#  Même commande sur le poste de dev et sur un runner GitHub :
#      npm run db:test:up   /   npm run db:test:down
#
#  Différences assumées avec docker-compose.yml :
#   - pas de `container_name` : il entrerait en collision avec la pile de dev ;
#   - pas de volume nommé, et un datadir en tmpfs : l'init rejoue à chaque
#     démarrage, donc mysql-init/*.sql s'applique toujours - contrairement au
#     volume externe de la prod, où ces scripts ne tournent qu'une seule fois ;
#   - port 3307, pour ne pas heurter un MySQL déjà présent sur 3306.
# ─────────────────────────────────────────────────────────────────────────────
name: secretlink-test

services:
  db:
    # Image, fuseau et scripts d'init : voir docker-compose.db.yml.
    extends:
      file: docker-compose.db.yml
      service: db

    environment:
      MYSQL_USER: link
      MYSQL_PASSWORD: cipass

    # Datadir en RAM : l'init est nettement plus rapide et ne laisse aucune
    # trace sur le disque au teardown.
    tmpfs:
      - /var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -ulink -pcipass --silent
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 20s
