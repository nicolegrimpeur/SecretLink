# ─────────────────────────────────────────────────────────────────────────────
#  Infrastructure des tests d'INTÉGRATION du serveur : une base MySQL
#  éphémère, et rien d'autre (l'API tourne dans le processus Vitest). La pile
#  complète, elle, est dans docker-compose.e2e.yml.
#  Même commande sur le poste de dev et sur un runner GitHub :
#      npm run integration:up   /   npm run integration:down
#
#  Différences assumées avec docker-compose.yml :
#   - pas de `container_name` : il entrerait en collision avec la pile de dev ;
#   - pas de volume nommé, et un datadir en tmpfs : la base repart vide à chaque
#     démarrage, et `integration:up` y rejoue toutes les migrations ;
#   - port 3307, pour ne pas heurter un MySQL déjà présent sur 3306.
# ─────────────────────────────────────────────────────────────────────────────
name: secretlink-integration

services:
  db:
    # Image et fuseau : voir docker-compose.db.yml.
    extends:
      file: docker-compose.db.yml
      service: db

    environment:
      MYSQL_USER: link
      MYSQL_PASSWORD: cipass

    # Datadir en RAM : l'init est nettement plus rapide et ne laisse aucune
    # trace sur le disque au teardown.
    tmpfs:
      - /var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -ulink -pcipass --silent
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 20s
