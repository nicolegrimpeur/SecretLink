services:
  db:
    # Image, fuseau et scripts d'init : voir docker-compose.db.yml.
    extends:
      file: docker-compose.db.yml
      service: db
    container_name: secretlink-db
    environment:
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Applique les migrations puis se termine ; le serveur attend sa sortie en
  # succès. Même `build` que `server` : le contexte étant identique, la seconde
  # construction est servie par le cache.
  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: secretlink-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: secretLink
    command: ["node", "scripts/migrate.mjs"]
    restart: "no"

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: secretlink-server
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: secretLink
      MASTER_KEY_V1: ${MASTER_KEY_V1}
      KEY_VERSION: ${KEY_VERSION:-1}
      SESSION_SECRET: ${SESSION_SECRET}
      IP_HMAC_SECRET: ${IP_HMAC_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      # Chaîne locale : navigateur -> nginx (service client) -> ici. Un seul saut de
      # confiance, contrairement à la prod qui en a deux (Traefik + nginx).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLOUDFLARE_IPS: ${CLOUDFLARE_IPS:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: secretlink-client
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: secretlink-db-data
