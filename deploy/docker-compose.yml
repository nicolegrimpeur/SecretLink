services:
  db:
    image: mysql:lts
    container_name: secretlink-db
    # Fuseau explicite : NOW() et CURRENT_TIMESTAMP écrivent en UTC, comme le driver
    # côté serveur (timezone: 'Z'). Sans ça, le fuseau dépend de celui de l'hôte.
    # Offset numérique et non "UTC" : un nom de zone exigerait les tables de fuseaux.
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: secretLink
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: secretlink-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: secretLink
      MASTER_KEY_V1: ${MASTER_KEY_V1}
      KEY_VERSION: ${KEY_VERSION:-1}
      SESSION_SECRET: ${SESSION_SECRET}
      IP_HMAC_SECRET: ${IP_HMAC_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      # Chaîne : Cloudflare -> Traefik -> nginx (service client) -> ici.
      # Les deux derniers sauts sont de confiance ; le troisième en partant de la fin
      # doit rester l'edge Cloudflare pour que CF-Connecting-IP soit promu.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLOUDFLARE_IPS: ${CLOUDFLARE_IPS:-}
    # Aucun port publié : le serveur n'est joignable que par le nginx du service client,
    # qui est le point d'entrée unique de la stack.
    expose:
      - "3000"
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: secretlink-client
    depends_on:
      - server
    expose:
      - "80"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: secretlink-alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: secretlink-db-data
