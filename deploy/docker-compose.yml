services:
  db:
    # Image, fuseau et scripts d'init : voir docker-compose.db.yml.
    extends:
      file: docker-compose.db.yml
      service: db
    container_name: secretlink-db
    environment:
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Applique les migrations de schéma en attente, puis se termine. Le serveur
  # n'est lancé qu'après sa sortie en succès, si bien qu'aucune version ne
  # tourne jamais contre un schéma qu'elle n'attend pas.
  #
  # Étape séparée plutôt qu'au démarrage du serveur : elle est visible dans les
  # logs, échoue bruyamment sans laisser l'application à moitié démarrée, et ne
  # couple pas le temps de démarrage à une opération de schéma.
  migrate:
    image: ghcr.io/nicolegrimpeur/secretlink-server:${SECRETLINK_TAG:?renseigner SECRETLINK_TAG dans deploy/.env}
    container_name: secretlink-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: secretLink
    command: ["node", "scripts/migrate.mjs"]
    # Conteneur à usage unique : le relancer en boucle le ferait rejouer sans
    # fin, alors qu'un échec doit rester visible et bloquer le démarrage.
    restart: "no"

  server:
    # Image publiée par .github/workflows/release.yml. `${VAR:?message}` fait
    # échouer bruyamment un SECRETLINK_TAG absent, là où un défaut silencieux
    # sur `latest` rendrait « qu'est-ce qui tourne ? » insoluble et le rollback
    # devinatoire. Pour construire localement à la place :
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
    image: ghcr.io/nicolegrimpeur/secretlink-server:${SECRETLINK_TAG:?renseigner SECRETLINK_TAG dans deploy/.env}
    container_name: secretlink-server
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-link}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: secretLink
      MASTER_KEY_V1: ${MASTER_KEY_V1}
      KEY_VERSION: ${KEY_VERSION:-1}
      SESSION_SECRET: ${SESSION_SECRET}
      IP_HMAC_SECRET: ${IP_HMAC_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      # Chaîne : Cloudflare -> Traefik -> nginx (service client) -> ici.
      # Les deux derniers sauts sont de confiance ; le troisième en partant de la fin
      # doit rester l'edge Cloudflare pour que CF-Connecting-IP soit promu.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLOUDFLARE_IPS: ${CLOUDFLARE_IPS:-}
    # Aucun port publié : le serveur n'est joignable que par le nginx du service client,
    # qui est le point d'entrée unique de la stack.
    expose:
      - "3000"
    restart: unless-stopped

  client:
    image: ghcr.io/nicolegrimpeur/secretlink-client:${SECRETLINK_TAG:?renseigner SECRETLINK_TAG dans deploy/.env}
    container_name: secretlink-client
    depends_on:
      - server
    expose:
      - "80"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: secretlink-alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: secretlink-db-data
