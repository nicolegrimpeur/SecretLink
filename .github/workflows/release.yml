name: Release

# Pilotée par la `version` du package.json racine : on livre en la bumpant dans
# une PR. Ce choix tient à une contrainte concrète du projet -
# client/src/app/shared/services/app-version.ts IMPORTE client/package.json et
# affiche cette version dans l'interface. La version doit donc être committée
# AVANT le build de l'image, sinon l'UI mentirait. Toute approche pilotée par
# tag ou par messages de commit la calcule après coup.
on:
  push:
    branches: [master]

  workflow_dispatch:
    inputs:
      force:
        description: Rejouer même si le tag existe déjà (ne recrée pas le tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-master
  # JAMAIS d'annulation : interrompre en plein push laisse des tags d'image à
  # moitié poussés et aucune release. À l'opposé exact de la CI.
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  #  Y a-t-il quelque chose à livrer ?
  #
  #  Ce job décide seul, en interrogeant l'état réel du dépôt - il ne déduit
  #  rien du fait d'avoir été déclenché. La grande majorité des pushs sur
  #  master ne sont pas des releases.
  # ───────────────────────────────────────────────────────────────────────────
  decide:
    name: Décider
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prev_tag: ${{ steps.v.outputs.prev_tag }}
      node: ${{ steps.v.outputs.node }}
      ext_version: ${{ steps.v.outputs.ext_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique ET tags complets : indispensable pour tester l'existence
          # du tag et calculer la plage du changelog.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Fail-fast avant toute publication : livrer des images dont les
      # package.json divergent produirait une version affichée fausse.
      - name: Cohérence des versions
        run: node scripts/sync-version.mjs --check

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "node=$(cat .nvmrc)"
            echo "ext_version=$(node -p 'require("./extension/manifest.json").version')"
            echo "prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          } >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "::warning::$TAG existe déjà - rejeu forcé."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG est déjà publié, rien à faire."
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publication de $TAG."
          fi

      - name: Récapitulatif
        shell: bash
        run: |
          {
            echo "### Décision"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | ${{ steps.v.outputs.version }} |"
            echo "| tag | ${{ steps.v.outputs.tag }} |"
            echo "| tag précédent | ${{ steps.v.outputs.prev_tag || '(aucun)' }} |"
            echo "| release | ${{ steps.v.outputs.release }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  #  Images vers GHCR - une construction par plateforme, sur runner natif
  #
  #  Poussées AVANT la création du tag : un build raté ne laisse ni tag ni
  #  release, donc un rejeu repart proprement. L'ordre inverse laisserait un
  #  tag orphelin qui ferait dire à `decide` « déjà publié ».
  #
  #  arm64 est construit sur un VRAI runner ARM, pas sous QEMU. Trois raisons :
  #  ces runners sont gratuits sur dépôt public, l'émulation d'un build Angular
  #  coûte 5 à 10x, et surtout esbuild - que la chaîne Angular utilise - est
  #  une source connue d'échecs erratiques sous émulation.
  #
  #  Chaque leg pousse SANS tag, par digest seul. Les tags sont posés ensuite
  #  par `manifest`, sur l'index qui référence les deux architectures : c'est
  #  ce qui permet à un `docker pull` de choisir tout seul la bonne image.
  # ───────────────────────────────────────────────────────────────────────────
  images:
    name: Image ${{ matrix.image }} (${{ matrix.platform }})
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push GHCR - aucun PAT nécessaire
    strategy:
      # Sans ça, l'échec d'un leg annulerait les autres en vol et laisserait
      # des digests orphelins dans le registry.
      fail-fast: false
      matrix:
        image: [server, client]
        platform: [linux/amd64, linux/arm64]
        # Les deux runners sont déclarés côte à côte, sur la même version
        # d'Ubuntu : les deux moitiés d'une même image multi-arch doivent être
        # construites sur le même OS, et une divergence doit sauter aux yeux.
        # Il n'existe pas de label `ubuntu-latest-arm` - GitHub ne publie ses
        # runners ARM qu'en versions explicites - donc la version est de toute
        # façon imposée d'un côté ; autant l'assumer des deux.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/secretlink-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ne sert ici qu'aux labels OCI : les tags sont posés par `manifest`, sur
      # l'index final.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.title=secretlink-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.decide.outputs.version }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          file: ./${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NODE_VERSION=${{ needs.decide.outputs.node }}
          labels: ${{ steps.meta.outputs.labels }}
          # `push-by-digest` : l'image part sans nom de tag, adressable par son
          # seul digest. Deux legs ne peuvent donc pas s'écraser un tag pendant
          # qu'ils tournent en parallèle.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scope par image ET par plateforme : sans la plateforme, les deux
          # architectures se détruiraient mutuellement leur cache.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          # Attestations BuildKit désactivées : elles ajouteraient des
          # manifestes parasites que `imagetools create` recopierait dans
          # l'index. La provenance est attestée sur l'index, dans `manifest`.
          provenance: false
          sbom: false

      # Le NOM du fichier est le digest : `manifest` n'a plus qu'à lire les
      # noms pour reconstituer la liste des architectures.
      - name: Exporter le digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  #  Index multi-architecture
  #
  #  Assemble les digests des deux plateformes en un manifeste unique, et c'est
  #  LUI qui reçoit les tags. Un `docker pull` depuis un Raspberry Pi y trouve
  #  le leg arm64, depuis un x86 le leg amd64, sans rien changer côté appelant.
  # ───────────────────────────────────────────────────────────────────────────
  manifest:
    name: Manifeste ${{ matrix.image }}
    needs: [decide, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # attestation de provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, client]
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/secretlink-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Le workflow est déclenché par un push de branche, pas de tag : on
          # fournit donc explicitement la valeur semver à interpréter.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.decide.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.decide.outputs.tag }}
            type=sha,format=long
            type=raw,value=latest

      - id: create
        name: Créer et pousser l'index
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          # `tags` est une liste séparée par des retours à la ligne. On la lit
          # dans un tableau plutôt qu'en expansion directe : une valeur vide ou
          # contenant un espace casserait une expansion naïve.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"

          refs=()
          for digest in *; do
            refs+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          [ ${#refs[@]} -gt 0 ] || { echo "::error::aucun digest récupéré"; exit 1; }

          echo "Assemblage de ${#refs[@]} architectures :"
          printf '  %s\n' "${refs[@]}"

          docker buildx imagetools create "${args[@]}" "${refs[@]}"

          # Digest de l'INDEX, et non d'un leg : c'est lui qu'on atteste.
          # On demande le champ au template plutôt que de parser le JSON : sa
          # sortie est indentée, et un `sed` sur `"digest":"` ne matchait pas
          # l'espace après les deux-points - il renvoyait silencieusement du
          # vide. Un template en erreur, lui, échoue franchement.
          FIRST_TAG="$(head -1 <<< "$TAGS")"
          INDEX_DIGEST="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')"
          [ -n "$INDEX_DIGEST" ] || { echo "::error::digest de l'index illisible"; exit 1; }
          echo "digest=$INDEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "index = $INDEX_DIGEST"

      # Garde-fou : sans elle, un leg manquant produirait un index amputé qui
      # ne se verrait qu'au `docker pull` sur le Raspberry Pi.
      - name: Vérifier la présence des deux architectures
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          FIRST_TAG="$(head -1 <<< "$TAGS")"
          docker buildx imagetools inspect "$FIRST_TAG" | tee /tmp/inspect.txt
          for arch in linux/amd64 linux/arm64; do
            grep -q "$arch" /tmp/inspect.txt || { echo "::error::$arch absent de l'index"; exit 1; }
          done

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.create.outputs.digest }}
          push-to-registry: true

  # ───────────────────────────────────────────────────────────────────────────
  #  Tag, release, changelog, et le zip de l'extension
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Tag et Release
    needs: [decide, manifest]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # créer le tag et la release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.decide.outputs.tag }}
      VERSION: ${{ needs.decide.outputs.version }}
      PREV: ${{ needs.decide.outputs.prev_tag }}
      EXT_VERSION: ${{ needs.decide.outputs.ext_version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Aujourd'hui ce zip est fabriqué à la main et gitignoré : exactement
      # l'étape qu'on oublie, ou qui produit une archive ne correspondant pas
      # au tag. Nommée d'après la version du manifest, qui suit son propre
      # cycle (le Chrome Web Store exige des versions strictement croissantes).
      - name: Empaqueter l'extension
        run: |
          set -euo pipefail
          ZIP="secretlink-extension-${EXT_VERSION}.zip"
          (cd extension && zip -r "../$ZIP" . -x '*.DS_Store' -x '__MACOSX/*')
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Composer les notes de release
        shell: bash
        run: |
          set -euo pipefail

          RANGE="${PREV:+$PREV..}HEAD"

          # Volet natif : GitHub liste les PR mergées depuis le tag précédent,
          # groupées d'après .github/release.yml, et ajoute lui-même le lien
          # « Full Changelog ». C'est l'INDEX de la release ; tout ce qu'on
          # ajoute ensuite doit être additif, sinon on fait relire deux fois la
          # même chose.
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${{ github.sha }}" \
            ${PREV:+-f previous_tag_name="$PREV"} \
            --jq .body > notes.md

          # Le squash merge suffixe le sujet du commit par « (#N) ». C'est ce
          # qui relie un commit de master à sa PR - et, par différence, ce qui
          # permet de repérer ce qui est arrivé SANS passer par une PR.
          PR_NUMBERS="$(git log --no-merges --pretty='%s' "$RANGE" \
            | sed -n 's/.*(#\([0-9]\+\))$/\1/p' | sort -n -u || true)"

          # Descriptions de PR : GitHub ne sait pas les inclure nativement.
          # Repliées dans des <details> pour que la release reste scannable,
          # le détail restant à un clic. Le titre y est un en-tête de section,
          # pas une seconde entrée de liste.
          cat > "$RUNNER_TEMP/pr-details.mjs" <<'PRD'
          import { execFileSync } from 'node:child_process';

          const numbers = (process.env.PR_NUMBERS ?? '').split(/\s+/).filter(Boolean);
          const blocks = [];

          for (const n of numbers) {
            let pr;
            try {
              pr = JSON.parse(
                execFileSync('gh', ['pr', 'view', n, '--json', 'title,body'], { encoding: 'utf8' }),
              );
            } catch {
              console.error(`::warning::PR #${n} illisible, ignorée dans les détails`);
              continue;
            }

            // Les gabarits de PR laissent des commentaires HTML d'instructions,
            // qui n'ont rien à faire dans une note de version.
            const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '').trim();
            // Une PR sans description n'apporterait rien de plus que l'index.
            if (!body) continue;

            blocks.push(
              `<details><summary><b>#${n} - ${pr.title}</b></summary>\n\n${body}\n\n</details>`,
            );
          }

          if (blocks.length > 0) {
            process.stdout.write(`\n## Détails\n\n${blocks.join('\n\n')}\n`);
          }
          PRD
          PR_NUMBERS="$PR_NUMBERS" node "$RUNNER_TEMP/pr-details.mjs" >> notes.md

          # Ce qui a atterri sur master SANS passer par une PR : invisible du
          # volet natif, donc la seule chose que `git log` apporte réellement.
          # Section omise quand il n'y a rien - le cas normal, protection de
          # branche oblige.
          OUTSIDE="$(git log --no-merges --pretty='- %s (%h)' "$RANGE" \
            | grep -vE '\(#[0-9]+\) \([0-9a-f]+\)$' || true)"

          if [ -n "$OUTSIDE" ]; then
            {
              echo ""
              echo "## Commits hors PR"
              echo ""
              echo "$OUTSIDE"
            } >> notes.md
          fi

          {
            echo ""
            echo "## Images"
            echo ""
            echo '```'
            echo "ghcr.io/$OWNER/secretlink-server:$VERSION"
            echo "ghcr.io/$OWNER/secretlink-client:$VERSION"
            echo '```'
          } >> notes.md

          echo "--- notes composées ---"
          cat notes.md

      # `gh release create` crée le tag lui-même sur --target : pas de
      # `git push --tags` à autoriser dans un éventuel ruleset de tags.
      # Et `gh` est préinstallé sur le runner, ce qui évite une action tierce.
      - name: Créer le tag et la release
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file notes.md \
            "$ZIP"

      - name: Récapitulatif
        run: |
          {
            echo "### Release $TAG publiée"
            echo ""
            echo "- https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo "- \`ghcr.io/$OWNER/secretlink-server:$VERSION\`"
            echo "- \`ghcr.io/$OWNER/secretlink-client:$VERSION\`"
            echo "- Asset : \`$ZIP\`"
          } >> "$GITHUB_STEP_SUMMARY"
