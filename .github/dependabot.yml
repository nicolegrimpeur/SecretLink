version: 2

# ⚠️ Les approbations `allowScripts` des package.json sont **épinglées par
# version**. Une PR qui monte un paquet listé dans `allowScripts` rebloque donc
# son script d'installation tant que la clé n'est pas mise à jour dans le même
# commit (`npm install-scripts approve`). C'est la sécurité de npm qui joue son
# rôle, mais ça se manifeste par un `npm ci` en échec dont la cause n'est pas
# évidente.

updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, server]
    groups:
      # Sans regroupement, chaque paquet ouvre sa propre PR et la CI tourne
      # autant de fois. Les correctifs et versions mineures n'ont aucune raison
      # d'être relus séparément.
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, client]
    groups:
      # Les paquets Angular doivent monter en bloc : une PR par paquet
      # produirait des combinaisons de versions incompatibles entre elles, donc
      # une CI rouge à chaque fois.
      angular:
        patterns: ["@angular*", "@angular-eslint*"]
      ionic:
        patterns: ["@ionic*", "ionicons"]
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Les majeures Angular et Ionic se font à la main, via `ng update` :
      # ses schematics réécrivent le code (opt-out de détection de changement,
      # migrations de templates...), ce que Dependabot ne sait pas faire. Une
      # PR Dependabot de majeure ne ferait que bumper les versions, sans ces
      # réécritures. S'y ajoute qu'Ionic suit les majeures Angular avec retard.
      #
      # Restreint aux MAJEURES à dessein : les correctifs de sécurité arrivent
      # quasi toujours en patch ou mineure, ils continuent donc de passer. Ne
      # pas surveiller le client du tout laisserait au contraire son millier de
      # dépendances transitives sans aucune couverture.
      - dependency-name: "@angular*"
        update-types: [version-update:semver-major]
      - dependency-name: "@ionic*"
        update-types: [version-update:semver-major]

      # TypeScript et Vitest sont bornés par les peerDependencies du compilateur
      # et du builder Angular : une version hors de ces bornes ne peut pas
      # builder, et la PR resterait rouge jusqu'à la majeure Angular suivante.
      # Ils montent donc avec Angular, lors du `ng update`. Bornes en vigueur :
      #   node -p "require('./client/node_modules/@angular/build/package.json').peerDependencies"
      #
      # TypeScript ignore aussi les MINEURES : Angular n'accepte en général
      # qu'une seule mineure de TypeScript par version. Et comme les mineures
      # sont groupées, une mineure refusée ferait échouer tout le lot
      # `mineures-et-correctifs` avec elle.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      # Les paquets @vitest/* exigent la version exacte de vitest : ils ne
      # peuvent pas changer de majeure seuls.
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, tests]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # Suit les `FROM` des Dockerfiles. Utile surtout pour les correctifs de
  # sécurité d'Alpine ; la majeure de Node, elle, reste pilotée par .nvmrc.
  - package-ecosystem: docker
    directories:
      - /server
      - /client
    schedule:
      interval: monthly
    labels: [dependencies, ci]
