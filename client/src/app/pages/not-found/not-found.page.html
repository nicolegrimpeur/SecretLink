<ion-content>

        <p class="code">404</p>
        <ion-card-title>Page introuvable</ion-card-title>
        <ion-card-subtitle>Comme un secret déjà lu, elle s'est peut-être autodétruite</ion-card-subtitle>

    </ion-card>
  </div>
</ion-content>
