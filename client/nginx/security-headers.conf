# En-têtes de sécurité de la SPA.
#
# À inclure dans CHAQUE location servant du statique : un `add_header` dans une
# location annule l'héritage de ceux du bloc parent, il n'y a pas de repli.
#
# À ne PAS inclure dans `location /api/` : helmet les pose déjà côté Express, et les
# cumuler produirait des doublons contradictoires (Referrer-Policy notamment).

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
