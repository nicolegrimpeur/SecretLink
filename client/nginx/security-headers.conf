# En-têtes de sécurité de la SPA.
#
# Volontairement dans un fichier à part, inclus dans chaque `location` qui sert du
# contenu statique : un `add_header` déclaré dans une location annule l'héritage de
# ceux du bloc `server`, il faut donc les redéclarer partout plutôt que de compter
# sur l'héritage.
#
# À ne PAS inclure dans `location /api/` : les réponses de l'API portent déjà les
# en-têtes posés par helmet côté Express, et les cumuler produirait des doublons
# contradictoires (Referrer-Policy notamment).

# connect-src 'self' suffit depuis que l'API est servie sous la même origine, en /api.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
