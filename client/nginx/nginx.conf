# Point d'entrée unique : ce conteneur sert la SPA ET proxifie l'API.
#   /       -> fichiers statiques Angular (fallback index.html)
#   /api/*  -> conteneur `server` (Express), préfixe /api retiré
# Le front et l'API partagent donc la même origine : plus de CORS pour le navigateur.

# Traefik termine TLS et transmet le protocole d'origine ; nginx, lui, écoute en clair
# dans le conteneur. On relaie la valeur reçue quand elle existe, $scheme sinon (dev).
map $http_x_forwarded_proto $fwd_proto {
  default  $scheme;
  "~."     $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  # `/api` tout court ne correspond pas au préfixe `/api/` ci-dessous et retomberait
  # sur la SPA, ce qui donnerait du HTML à un appelant qui attend du JSON.
  location = /api {
    # Location relatif : nginx écoute en clair derrière la terminaison TLS, un
    # Location absolu renverrait donc vers http:// depuis une page en https://.
    absolute_redirect off;
    return 308 /api/;
  }

  # `^~` est indispensable : sans lui, la location regex des assets ci-dessous
  # l'emporterait sur ce préfixe et une route d'API finissant par .js serait servie
  # depuis le disque (ou renvoyée sur index.html par try_files).
  location ^~ /api/ {
    # Upstream dans une variable + résolveur Docker : avec un nom d'hôte écrit en dur,
    # nginx fige l'IP du conteneur au démarrage et sert des 502 après chaque
    # redéploiement du serveur.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream server;

    # Le serveur Express expose /users et /links à sa racine.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;

    # Aligné sur bodyParser.json({ limit: '1mb' })
    client_max_body_size 1m;

    # Pas d'include des en-têtes de sécurité : helmet s'en charge côté Express.
  }

  # ---------------------------------------------------------------------------
  # Statique
  # ---------------------------------------------------------------------------
  # Les pages publiques du front sont indexables ; l'API et tout ce qui est
  # authentifié ou à usage unique ne le sont pas
  location = /robots.txt {
    include /etc/nginx/security-headers.conf;
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\nAllow: /auth\nAllow: /legal\nAllow: /privacy\nDisallow: /api/\nDisallow: /redeem/\nDisallow: /dashboard\nDisallow: /links\nDisallow: /account\n";
  }

  # Routes de la SPA -> index.html. La liste suit client/src/app/app.routes.ts :
  # toute autre URL reçoit un 404 (location / plus bas).
  # Pages publiques : l'en-tête Link donne à Google leur URL canonique.
  location ~ ^/(?:auth|legal|privacy)?$ {
    include /etc/nginx/security-headers.conf;
    # Relevé avant try_files, qui réécrit $uri en /index.html
    set $canonical_path $uri;
    add_header Link "<$fwd_proto://$http_host$canonical_path>; rel=\"canonical\"" always;
    try_files /index.html =404;
  }

  location ~ ^/(?:dashboard|links|account|redeem/[^/]+)$ {
    include /etc/nginx/security-headers.conf;
    try_files /index.html =404;
  }

  # Cache agressif pour assets hashés
  location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
    include /etc/nginx/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Autres fichiers du build ; une URL inconnue reçoit index.html avec le statut
  # 404, et la SPA y affiche sa page introuvable
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    error_page 404 /index.html;
  }
}
